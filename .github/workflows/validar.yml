name: validar-publicacion

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar paquete
        run: python -m pip install -e .
      - name: Validar resultados publicados
        run: python -m unittest discover -s 05_verificacion/tests -v

