[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mip-guatemala-2013-reproducible"
version = "0.1.0"
description = "Extracción, transformación y validación reproducible de la MIP producto por producto de Guatemala 2013."
requires-python = ">=3.10"
dependencies = [
  "numpy==2.3.5",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "PyYAML==6.0.3",
]

[tool.setuptools]
package-dir = {"" = "04_reproduccion_python/src"}

[tool.setuptools.packages.find]
where = ["04_reproduccion_python/src"]

