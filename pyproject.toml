[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mip-guatemala-2013-reproducible"
version = "1.1.0"
description = "Extracción, transformación y validación reproducible de la MIP producto por producto de Guatemala 2013."
requires-python = ">=3.11"
dependencies = [
  "numpy==2.3.5",
  "openpyxl==3.1.5",
  "pandas==2.2.3",
  "plotly==6.9.0",
  "PyYAML==6.0.3",
]

[tool.setuptools]
package-dir = {"" = "04_reproduccion_python/src"}

[tool.setuptools.packages.find]
where = ["04_reproduccion_python/src"]
